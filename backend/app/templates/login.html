{% extends "base.html" %}

{% block title %}Login — Book-IA{% endblock %}

{% block extra_head %}
<style>
  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #0f2744 0%, #08101c 55%, #050a12 100%);
  }
  .login-card {
    background: rgba(7, 15, 28, 0.78);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(124, 231, 255, 0.12);
    border-radius: 1rem;
  }
  .form-control {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(124, 231, 255, 0.2);
    color: #e8f4ff;
  }
  .form-control:focus {
    background: rgba(255, 255, 255, 0.1);
    border-color: #7ce7ff;
    color: #fff;
    box-shadow: 0 0 0 0.2rem rgba(124, 231, 255, 0.15);
  }
  .form-label {
    color: rgba(232, 244, 255, 0.85);
  }
  nav.navbar,
  footer {
    display: none !important;
  }
</style>
{% endblock %}

{% block content %}
<section class="d-flex align-items-center py-5 min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="login-card shadow-lg p-4 p-md-5">
          <div class="text-center mb-4">
            <h1 class="display-6 fw-bolder mb-2">
              <span class="text-gradient d-inline">Book-IA</span>
            </h1>
            <p class="text-muted mb-0">Faça login para continuar</p>
          </div>

          {% if error %}
          <div class="alert alert-danger small" role="alert">
            Login ou senha inválidos. Tente novamente.
          </div>
          {% endif %}

          <form method="post" action="/api/v1/auth/login">
            <div class="mb-3">
              <label for="login" class="form-label small">Login</label>
              <input
                type="text"
                class="form-control rounded-4"
                id="login"
                name="login"
                required
                autocomplete="username"
              />
            </div>
            <div class="mb-4">
              <label for="senha" class="form-label small">Senha</label>
              <input
                type="password"
                class="form-control rounded-4"
                id="senha"
                name="senha"
                required
                autocomplete="current-password"
              />
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg rounded-4">
                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
