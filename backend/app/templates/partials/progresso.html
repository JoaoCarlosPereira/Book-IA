<div class="progress rounded-4" style="height: 1rem; background: rgba(13, 24, 44, 0.92);">
  <div
    class="progress-bar bg-gradient-primary-to-secondary"
    role="progressbar"
    style="width: {{ progresso }}%"
    aria-valuenow="{{ progresso }}"
    aria-valuemin="0"
    aria-valuemax="100"
  >
    {{ progresso }}%
  </div>
</div>
{% if etapa is defined and etapa %}
<p class="small text-muted mb-0 mt-1">
  <i class="bi bi-layers me-1"></i>{{ etapa }}
</p>
{% endif %}
