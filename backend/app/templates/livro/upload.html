{% extends "base.html" %}

{% block title %}Upload — Book-IA{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container px-4 px-lg-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="glass-card rounded-4 shadow-lg p-4 p-md-5">
          <h1 class="h3 fw-bold mb-1">
            <span class="text-gradient">Enviar livro</span>
          </h1>
          <p class="text-muted mb-4">
            PDF, EPUB ou TXT — o processamento inicia automaticamente após o upload.
          </p>

          <div id="upload-result"></div>

          <form
            id="upload-form"
            hx-post="/api/v1/livros/upload"
            hx-encoding="multipart/form-data"
            hx-target="#upload-result"
            hx-swap="innerHTML"
          >
            <div class="mb-3">
              <label for="arquivo" class="form-label">Arquivo</label>
              <input
                type="file"
                class="form-control rounded-4"
                id="arquivo"
                name="arquivo"
                accept=".pdf,.epub,.txt,application/pdf"
                required
              />
            </div>
            <div class="mb-4">
              <label for="nivel_producao" class="form-label">Nível de produção</label>
              <select
                class="form-select rounded-4"
                id="nivel_producao"
                name="nivel_producao"
              >
                <option value="basico">Básico</option>
                <option value="avancado">Avançado</option>
                <option value="profissional">Profissional</option>
              </select>
            </div>
            <div class="d-grid gap-2 d-md-flex">
              <button type="submit" class="btn btn-primary btn-lg rounded-4 flex-grow-1">
                <i class="bi bi-upload me-1"></i> Enviar
              </button>
              <a href="/dashboard" class="btn btn-outline-dark btn-lg rounded-4">Voltar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
