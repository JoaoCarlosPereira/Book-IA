[pytest]
asyncio_mode = auto
pythonpath = backend
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=app.services.pdf_processor
    --cov=app.services.ia_analyzer
    --cov=app.services.tts_engine
    --cov=app.services.musicgen
    --cov=app.services.auth_service
    --cov-report=term-missing
    # Use --cov-fail-under=80 only for service unit tests (see scripts/run_tests.ps1)

[coverage:run]
omit =
    */__init__.py

[coverage:report]
fail_under = 80
show_missing = true
