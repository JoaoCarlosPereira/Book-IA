# Optional PostgreSQL + Redis for manual / CI integration runs.
# Unit and integration tests use in-memory SQLite by default (pytest).
# Start: docker compose -f docker-compose.test.yml up -d
# Stop:  docker compose -f docker-compose.test.yml down -v

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: bookia-postgres-test
    environment:
      POSTGRES_DB: bookia_test
      POSTGRES_USER: bookia
      POSTGRES_PASSWORD: bookia
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookia -d bookia_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: bookia-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
